name: Update GitHub Stats
on:
  schedule:
    - cron: '0 0 * * *' # รันทุกเที่ยงคืน
  workflow_dispatch: # ปุ่มกดรันเอง

jobs:
  generate-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      # 1. สร้าง Stats (โหมดสว่าง - Default)
      - name: Generate Stats (Light)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          card: stats
          options: 'username=nattapat2871&show_icons=true&count_private=true&theme=default'
          path: 'generated/stats-light.svg'

      # 2. สร้าง Stats (โหมดมืด - GitHub Dark)
      - name: Generate Stats (Dark)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          card: stats
          options: 'username=nattapat2871&show_icons=true&count_private=true&theme=github_dark'
          path: 'generated/stats-dark.svg'

      # 3. สร้าง Top Langs (โหมดสว่าง - Default)
      - name: Generate Top Langs (Light)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          card: top-langs
          options: 'username=nattapat2871&langs_count=10&locale=en&custom_title=Top%20Languages&theme=default'
          path: 'generated/top-langs-light.svg'

      # 4. สร้าง Top Langs (โหมดมืด - GitHub Dark)
      - name: Generate Top Langs (Dark)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          card: top-langs
          options: 'username=nattapat2871&langs_count=10&locale=en&custom_title=Top%20Languages&theme=github_dark'
          path: 'generated/top-langs-dark.svg'

      # 5. บันทึกไฟล์ลง Git
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add generated/
          git commit -m "Update stats images" || exit 0
          git push
